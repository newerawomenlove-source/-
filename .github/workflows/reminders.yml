name: Reminders

on:
  schedule:
    - cron: "0 9 24 11 *"  # ежегодно 24 ноября — продлить прокси
    - cron: "0 9 1 * *"    # 1 числа каждого месяца — проверить баланс Selectel
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send scheduled reminder
        env:
          BOT_TOKEN: ${{ secrets.WATCHDOG_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.WATCHDOG_ADMIN_CHAT_ID }}
        run: |
          set -uo pipefail

          text=""
          if [ "$(date -u +%m-%d)" = "11-24" ]; then
            text="⏰ Напоминание: пора продлить прокси для бота (proxy6.net). Если купишь новый — пришли данные (IP, порт, логин, пароль) в чат Claude, настройки бота обновят."
          elif [ "$(date -u +%d)" = "01" ]; then
            text="💰 Напоминание: проверь баланс сервера на Selectel (selectel.ru). Если баланс на нуле — пополни: сервер отключат, а через 14 дней удалят бота и базу навсегда."
          fi

          if [ -n "$text" ]; then
            IFS=',' read -ra CHAT_IDS <<< "$ADMIN_CHAT_ID"
            for chat_id in "${CHAT_IDS[@]}"; do
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="$chat_id" \
                -d text="$text" > /dev/null
            done
          fi
