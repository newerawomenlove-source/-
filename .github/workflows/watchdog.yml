name: Watchdog

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check bot health and notify on state change
        env:
          BOT_TOKEN: ${{ secrets.WATCHDOG_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.WATCHDOG_ADMIN_CHAT_ID }}
          HEALTH_URL: "http://135.106.182.116:8080/health"
          STATE_FILE: ".github/watchdog-state.txt"
        run: |
          set -uo pipefail

          prev_state="healthy"
          if [ -f "$STATE_FILE" ]; then
            prev_state="$(cat "$STATE_FILE")"
          fi

          if curl -sf --connect-timeout 15 --max-time 20 "$HEALTH_URL" > /dev/null; then
            new_state="healthy"
          else
            new_state="down"
          fi

          echo "prev_state=$prev_state new_state=$new_state"

          notify() {
            local text="$1"
            IFS=',' read -ra CHAT_IDS <<< "$ADMIN_CHAT_ID"
            for chat_id in "${CHAT_IDS[@]}"; do
              curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                -d chat_id="$chat_id" \
                -d text="$text" > /dev/null
            done
          }

          if [ "$prev_state" != "$new_state" ]; then
            if [ "$new_state" = "down" ]; then
              notify "⚠️ Бот «Женщины нового времени» не отвечает уже несколько минут. Проверьте сервер (Selectel) и прокси."
            else
              notify "✅ Бот «Женщины нового времени» снова работает."
            fi
          fi

          mkdir -p "$(dirname "$STATE_FILE")"
          echo "$new_state" > "$STATE_FILE"

          if ! git diff --quiet -- "$STATE_FILE"; then
            git config user.name "watchdog-bot"
            git config user.email "actions@users.noreply.github.com"
            git add "$STATE_FILE"
            git commit -m "watchdog: state -> $new_state"
            git push
          fi
